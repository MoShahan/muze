name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint, format, and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx expo lint

      - name: Check formatting
        run: >-
          npx prettier --check "src/**/*.{ts,tsx,css}" "scripts/**/*.js"
          "app.json" "package.json" "package-lock.json" "tsconfig.json"
          "eslint.config.js" "jest.config.js" "jest.setup.ts" ".prettierrc"
          ".github/workflows/ci.yml"

      - name: Type-check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci
